name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  appliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y busybox-static linux-image-generic e2fsprogs dosfstools exfatprogs util-linux cpio
      - run: sudo chmod 0644 /boot/vmlinuz-* && bash appliance/build.sh
      - uses: actions/upload-artifact@v4
        with: { name: appliance, path: appliance/build/ }

  binaries:
    needs: appliance
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,  script: bash packaging/build.sh }
          - { os: windows-latest, script: pwsh packaging/build.ps1 }
          - { os: macos-latest,   script: bash packaging/build.sh }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with: { name: appliance, path: appliance/build }
      - run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with: { name: dist-${{ matrix.os }}, path: dist/vdi-*.* }

  publish:
    needs: binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: dist-*, merge-multiple: true, path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
